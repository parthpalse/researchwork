[project]
name = "nutrition-risk-engine"
version = "0.1.0"
description = "Trust-First AI Nutrition Risk System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
